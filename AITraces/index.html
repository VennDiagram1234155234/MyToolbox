<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Traces Detector — Поиск ИИ-следов</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module">
        import * as pdfjsLib from './build/pdf.mjs';
        window.pdfjsLib = pdfjsLib;
    </script>
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Системный заголовок в стиле Deus Ex -->
        <h1><span class="system-tag">[ // AI_TRACES_SCANNER ]</span> AI Traces Detector</h1>
        <div class="header-line"></div>

        <div class="main-layout">
            <!-- Панель ввода (Загрузка файлов и текст) -->
            <div class="editor-panel">
                <h2>Входящий поток данных</h2>
                
                <div class="drop-zone" id="dropZone">
                    <p>ПЕРЕТАЩИТЕ СЮДА ФАЙЛ PDF / TXT ИЛИ НАЖМИТЕ ДЛЯ ВЫБОРА</p>
                    <input type="file" id="fileInput" accept=".txt,.pdf" hidden>
                </div>

                <div class="input-area">
                    <textarea id="textInput" placeholder="Или просто вставьте сырой текст сюда для лингвистического анализа..."></textarea>
                </div>
                
                <!-- Переключатель режимов онлайн/офлайн -->
                <button id="modeBtn" class="btn btn-mode" style="margin-bottom: 12px;" onclick="toggleMode()">Режим: Офлайн</button>
                <button id="analyzeBtn" class="btn btn-success">Запустить сканирование</button>
                
                <!-- Спиннер загрузки для будущих запросов -->
                <div id="loadingSpinner" class="spinner hidden"></div>
            </div>

            <!-- Панель вывода результатов -->
            <div class="library-panel">
                <h2>Результаты проверки</h2>
                
                <div id="results" class="hidden">
                    <div class="score-card">
                        <p>ВЕРДИКТ: <span id="aiScore">-</span></p>
                        <p>НАЙДЕНО МАРКЕРОВ: <span id="markerCount">-</span></p>
                    </div>
                    
                    <h2>Текст с подсветкой ИИ-следов</h2>
                    <div id="highlightedText" class="text-preview"></div>
                    
                    <h2>Обнаруженные текстовые штампы</h2>
                    <ul id="markerList" class="prompts-list"></ul>
                </div>
                
                <!-- Заглушка, пока анализ не запущен -->
                <div id="resultsPlaceholder" style="color: #475569; text-align: center; padding-top: 100px; font-family: monospace;">
                    [ СИСТЕМА ОЖИДАЕТ ЗАПУСКА СКАНИРОВАНИЯ ]
                </div>
            </div>
        </div>
    </div>
</body>
</html>
