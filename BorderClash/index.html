<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Симулятор Войны Границ</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <!-- Верхняя панель управления игрой -->
    <div id="controls">
        <button id="btn-reset">Сброс / Рисовать</button>
        <button id="btn-auto" disabled>Запустить симуляцию</button>
        <button id="btn-speed" style="display: none; ">Скорость: 1x</button>
        <button id="btn-heatmap">Хитмап: ВЫКЛ</button>
        <div id="status">Шаг 1: Нарисуйте границу</div>
        <!-- Новые кнопки перемирия -->
        <button id="btn-peace" style="display: none; background-color: #cca700; color: #000;">Заключить мир</button>
        <button id="btn-confirm-border" style="display: none; background-color: #1e3a1e; color: #fff;">Утвердить новые границы</button>
    </div>


    <!-- Главный контейнер игрового поля -->
    <div id="game-container">
        <!-- Фоновые визуальные текстовые метки для стран -->
        <div id="label-left" class="hud-label">Страна А</div>
        <div id="label-right" class="hud-label">Страна Б</div>
        
        <!-- Холст для отрисовки графики через JavaScript -->
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
    </div>
</body>
</html>
