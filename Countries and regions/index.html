<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries and regions</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3Cpath d='M16 32h32' stroke='%23ffffff' stroke-width='2' opacity='0.75'/%3E%3Cpath d='M32 14c7 8 7 28 0 36-7-8-7-28 0-36Z' fill='%23ffffff' opacity='0.22'/%3E%3Cpath d='M32 21l2.1 6.3h6.7l-5.4 3.9 2.1 6.3-5.5-3.9-5.5 3.9 2.1-6.3-5.4-3.9h6.7L32 21Z' fill='%23ffffff' opacity='0.85'/%3E%3C/svg%3E"
  />
</head>

<body>
  <div class="app">
    <div class="map-wrap">
      <div class="map" id="map">
        <img id="mapBg" class="map-bg" alt="Map" />
        <svg class="borders" viewBox="0 0 540 660" aria-hidden="true" id="mapSvg">
          <g id="regionsLayer" class="regions-layer"></g>
          <g id="boundariesLayer"></g>
          <!-- Dev tool -------------------------------------------------------------------------------------------->
          <g id="vertexLabelsLayer"></g>
          <!--End of Dev tool -------------------------------------------------------------------------------------->
        </svg>
        <div id="reinforcementToken" class="reinforcement-token">+0</div>
      </div>
    </div>
      <div class="panel">
        <h1 style="padding-left: 10px; margin-top: 15px;">Countries and regions</h1>
        <p class="muted" style="padding-left: 10px; margin-bottom: 10px;">by @vennerkurh 2026</p>

        <!-- Основной статус игры -->
        <div class="status" style="padding: 5px 10px; box-sizing: border-box;">
            <p style="margin: 6px 0;"><strong>Current move:</strong> <span id="turnText"></span></p>
            <p style="margin: 6px 0;"><strong>Mode:</strong> <span id="modeText"></span></p>
            <p style="margin: 6px 0;"><strong>Status:</strong> <span id="warText"></span></p>
        </div>


        <!-- Сетка для разделения кнопок и статистики по горизонтали -->
                    <!-- Сетка для разделения кнопок и статистики по горизонтали -->
        <div style="display: flex; gap: 15px; align-items: flex-start; width: 100%; box-sizing: border-box; padding: 5px 10px;">
            
            <!-- КОЛОНКА 1: Кнопки управления (с добавленными внутренними отступами) -->
            <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding-right: 5px;">
                <div class="controls">
                    <button id="endTurnBtn" class="btn-primary" style="margin-top: 5px;">Proceed</button>
                    <button id="moveModeBtn" class="btn-secondary">Movement</button>
                    <button id="attackModeBtn" class="btn-danger">Attack</button>
                    
                    <button id="buildFactoryBtn" class="btn-secondary" disabled>Build factories</button>
                    <button id="demolishFactoryBtn" class="btn-secondary" disabled>Demolish factories</button>
                    
                    <button id="artilleryAttackModeBtn" class="btn-danger" style="grid-column: 1 / -1;">Artillery Strike Mode</button>
                    <button id="buildArtilleryBtn" class="btn-secondary" disabled>Build Artillery</button>
                    <button id="scrapArtilleryBtn" class="btn-secondary" disabled>Delete Artillery</button>
                    
                    <button id="truceBtn" class="btn-success">Peace</button>
                    <button id="warBtn" class="btn-danger">Declare war</button>
                    <button id="formAllianceBtn" class="btn-secondary">Form alliance</button>
                    <button id="breakAllianceBtn" class="btn-secondary">Break alliance</button>

                </div>
                <button id="factoriesToggleBtn" class="btn-secondary" style="grid-column: 1 / -1;">Factories: off</button>   
                <button id="restartBtn" class="btn-secondary">Restart game</button>
            </div>

                        <!-- КОЛОНКА СТАТИСТИКИ (Справа от кнопок) -->
            <div style="display: flex; flex-direction: column; gap: 12px;">
                
                <!-- Окно потерь -->
                <div class="status" style="width: 280px; min-width: 260px; border-left: 3px solid #ef4444; margin: 0; background: #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);">
                    <details id="statsDetails" open>
                        <summary style="cursor: pointer; font-weight: bold; color: #ef4444; user-select: none; padding-bottom: 5px;">Total Casualties</summary>
                        <div id="casualtyStatsContainer" style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding-right: 8px;">
                            <!-- Сюда JavaScript рендерит данные -->
                        </div>
                    </details>
                </div>

                <!-- Ползунок зомби теперь привязан к этой же колонке и встанет строго под ней -->
                <div id="zombieSliderContainer" class="status" style="display: none; width: 280px; min-width: 260px; background: #1e293b; border-radius: 8px; padding: 15px; box-sizing: border-box; border-left: 3px solid #f43f5e; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);">
                    <p style="margin: 0 0 8px 0; color: #f43f5e; font-weight: bold;">🧟 Initial Zombies Count</p>
                    <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                        <input id="zombieCountRange" type="range" min="100" max="20000" step="100" value="1000" style="flex-grow: 1; accent-color: #f43f5e; cursor: pointer;" />
                        <span id="zombieCountText" style="font-weight: bold; min-width: 55px; text-align: right; color: #fff;">1000</span>
                    </div>
                </div>

            </div>


        </div>

        <!-- Выбор карт и системный лог -->
        <div class="status" style="margin-top: 15px;">
            <p><strong>Maps</strong></p>
            <div class="controls">
                <select id="mapSelect" style="padding:10px;border-radius:8px;border:1px solid #d1d5db;">
                    <option value="default">2 countries</option>
                    <option value="zombie_map">zombie apocalypse (7 countries v2)</option>
                    <option value="random_unions">random (with unions)</option>
                    <option value="random_no_unions">random (no unions)</option>
                </select>
                <button id="loadMapBtn" class="btn-secondary">Load map</button>
            </div>
            <div class="zoom-row">
                <label for="zoomRange"><strong>Scale:</strong></label>
                <input id="zoomRange" type="range" min="70" max="170" step="5" value="100" />
                <span id="zoomText">100%</span>
            </div>
        </div>
        <div class="log" id="log"></div>
    </div>

  </div>
  <div id="passOverlay" class="pass-overlay" role="dialog" aria-modal="true">
    <div class="pass-card">
      <h2 id="passTitle">Pass the turn</h2>
      <p id="passText">Pass the device to the next player.</p>
      <button id="startTurnBtn" class="btn-primary">Start move</button>
    </div>
  </div>
  <div id="unitsOverlay" class="units-overlay" role="dialog" aria-modal="true">
    <div class="units-card">
      <h3 id="unitsPromptTitle">Enter number</h3>
      <p id="unitsPromptMeta" class="units-meta"></p>
      <div id="unitsPromptDisplay" class="units-display"></div>
      <div class="units-keypad">
        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button id="unitsBackBtn">⌫</button>
        <button data-digit="0">0</button>
        <button id="unitsClearBtn">C</button>
      </div>
      <div class="units-actions">
        <button id="unitsCancelBtn" class="cancel-btn">Cancel</button>
        <button id="unitsOkBtn" class="ok-btn">OK</button>
      </div>
    </div>
  </div>
</body>
</html>
